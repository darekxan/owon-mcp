[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "owon-mcp"
version = "0.1.0"
description = "Local MCP server for OWON oscilloscopes, powered by OWON Scope Web"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "mcp>=2.3.0,<3",
  "owon-scope-web @ git+https://github.com/fmesasc/owon-scope-web.git@cb86012000048b8441318a293fe7a41a83f98023",
]

[project.scripts]
owon-mcp = "owon_mcp.__main__:main"

[project.urls]
Repository = "https://github.com/darekxan/owon-mcp"
Issues = "https://github.com/darekxan/owon-mcp/issues"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.11"]

[tool.hatch.build.targets.wheel]
packages = ["src/owon_mcp"]

[tool.hatch.build.targets.sdist]
include = [
  "/src/owon_mcp",
  "/tests",
  "/scripts",
  "/docs",
  "/examples",
  "/README.md",
  "/LICENSE",
  "/NOTICE",
  "/pyproject.toml",
  "/uv.lock",
  "/owon_read.py",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
